# Temporary public demo transport. For submission use HTTPS with a real domain.
# Never serve private media or run the inference server on port 8000 directly.
server {
  listen 80 default_server;
  server_name _;
  client_max_body_size 82m;
  server_tokens off;
  location / {
    limit_req zone=roadguard_rate burst=20 nodelay;
    proxy_pass http://127.0.0.1:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 1200;
    proxy_send_timeout 1200;
  }
}
